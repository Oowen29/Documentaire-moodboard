<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodboard</title>
<style>
  :root{
    --deep: #030a12;
    --deep2: #061420;
    --line: rgba(180, 210, 220, 0.14);
    --foam: #dfeef0;
    --foam-dim: rgba(223,238,240,0.55);
    --kelp: #163a3f;
    --accent: #6fb8c4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: radial-gradient(ellipse at 20% 0%, #08202c 0%, var(--deep) 45%, #010508 100%);
    overflow:hidden;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--foam);
  }
  .caustics{
    position:fixed; inset:0; pointer-events:none; opacity:0.05;
    background-image:
      radial-gradient(circle at 10% 20%, var(--accent) 0, transparent 35%),
      radial-gradient(circle at 80% 60%, var(--accent) 0, transparent 40%),
      radial-gradient(circle at 40% 90%, var(--accent) 0, transparent 30%);
    mix-blend-mode: screen;
  }
  header{
    position: fixed; top:0; left:0; right:0;
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 22px 30px;
    z-index: 20;
    pointer-events:none;
  }
  header h1{
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin:0;
    color: var(--foam);
    font-style: italic;
  }
  header .count{
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 11px;
    color: var(--foam-dim);
    letter-spacing: 0.03em;
  }
  #project-switch{
    position: fixed;
    top: 64px; left: 30px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  #project-select{
    background: rgba(12,26,34,0.85);
    color: var(--foam);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    max-width: 180px;
    cursor: pointer;
  }
  #new-project-btn{
    background: rgba(12,26,34,0.85);
    color: var(--foam-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 26px; height: 26px;
    font-size: 15px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #new-project-btn:hover{ color: var(--foam); border-color: var(--accent); }
  #board{
    position:absolute; inset:0;
    width: 3200px; height: 2000px;
    top:0; left:0;
  }
  #viewport{
    position:fixed; inset:0;
    overflow: hidden;
    cursor: grab;
  }
  #viewport.panning{ cursor: grabbing; }
  .card{
    position:absolute;
    background: #0c1a22;
    padding: 10px 10px 34px 10px;
    border-radius: 3px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: box-shadow 0.18s ease;
  }
  .card.dragging{
    cursor: grabbing;
    box-shadow: 0 26px 50px rgba(0,0,0,0.7);
    z-index: 500 !important;
    transition: none;
  }
  .card img{
    display:block;
    width: 220px;
    height: auto;
    pointer-events:none;
    filter: saturate(0.96) contrast(1.02);
  }
  .card .tag{
    position:absolute;
    bottom: 9px; left: 10px; right: 34px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10px;
    color: rgba(223,238,240,0.4);
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .card .remove{
    position:absolute;
    top: 6px; right: 6px;
    width: 20px; height:20px;
    border-radius: 50%;
    background: rgba(3,10,18,0.7);
    border: 1px solid var(--line);
    color: var(--foam-dim);
    font-size: 12px;
    line-height: 18px;
    text-align:center;
    cursor:pointer;
    opacity:0;
    transition: opacity 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .card:hover .remove{ opacity:1; }
  .card .remove:hover{ color: #ff9d8a; border-color: #ff9d8a; }
  .card .resize{
    position:absolute;
    bottom: 6px; right: 6px;
    width: 16px; height:16px;
    cursor: nwse-resize;
    opacity:0;
    transition: opacity 0.15s ease;
  }
  .card:hover .resize{ opacity:1; }
  .card .resize::after{
    content:"";
    position:absolute;
    right:2px; bottom:2px;
    width: 9px; height:9px;
    border-right: 2px solid var(--foam-dim);
    border-bottom: 2px solid var(--foam-dim);
  }

  #dropzone{
    position:fixed; inset:0;
    z-index: 900;
    display:none;
    align-items:center; justify-content:center;
    background: rgba(3,10,18,0.72);
    backdrop-filter: blur(2px);
    border: 2px dashed var(--accent);
    margin: 14px;
    border-radius: 8px;
    pointer-events:none;
  }
  #dropzone.active{ display:flex; }
  #dropzone span{
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  #add-btn{
    position: fixed;
    bottom: 26px; right: 26px;
    z-index: 200;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--kelp);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--foam);
    font-size: 24px;
    font-family: -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #add-btn:hover{ background:#1c4a51; transform: scale(1.06); }
  #add-btn:active{ transform: scale(0.96); }

  #hint{
    position: fixed;
    bottom: 30px; left: 30px;
    z-index: 150;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 11px;
    color: var(--foam-dim);
    letter-spacing: 0.02em;
    pointer-events:none;
  }

  #zoom-controls{
    position: fixed;
    bottom: 26px; right: 150px;
    z-index: 200;
    display:flex;
    gap: 6px;
  }
  .zbtn{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(12,26,34,0.8);
    border: 1px solid var(--line);
    color: var(--foam-dim);
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .zbtn:hover{ color: var(--foam); border-color: var(--accent); }

  .card.text-card{
    background: rgba(12,26,34,0.85);
    padding: 14px 16px;
    min-width: 140px;
    max-width: 360px;
  }
  .card.text-card .txt{
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--foam);
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
    min-width: 40px;
    min-height: 1.4em;
  }
  .card.text-card .txt:empty::before{
    content: "Écris ici…";
    color: var(--foam-dim);
  }
  #add-text-btn{
    position: fixed;
    bottom: 26px; right: 86px;
    z-index: 200;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--kelp);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--foam);
    font-size: 18px;
    font-family: Georgia, serif;
    font-style: italic;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #add-text-btn:hover{ background:#1c4a51; transform: scale(1.06); }
  #add-text-btn:active{ transform: scale(0.96); }
  input[type=file]{ display:none; }
</style>
</head>
<body>

<div class="caustics"></div>

<header>
  <h1 id="project-title">Moodboard</h1>
  <div class="count" id="count"></div>
</header>

<div id="project-switch">
  <select id="project-select"></select>
  <div id="new-project-btn" title="Nouveau projet">+</div>
</div>

<div id="viewport">
  <div id="board"></div>
</div>

<div id="dropzone"><span>Dépose tes images ici</span></div>

<div id="hint">Glisse pour déplacer une photo · glisse-dépose un fichier n'importe où pour l'ajouter</div>

<div id="zoom-controls">
  <div class="zbtn" id="zoom-out">−</div>
  <div class="zbtn" id="zoom-reset">⤢</div>
  <div class="zbtn" id="zoom-in">+</div>
</div>

<div id="add-text-btn">Aa</div>
<div id="add-btn">+</div>
<input type="file" id="file-input" accept="image/*" multiple>

<script>
(function(){
  const board = document.getElementById('board');
  const viewport = document.getElementById('viewport');
  const dropzone = document.getElementById('dropzone');
  const addBtn = document.getElementById('add-btn');
  const addTextBtn = document.getElementById('add-text-btn');
  const fileInput = document.getElementById('file-input');
  const countEl = document.getElementById('count');
  const zoomIn = document.getElementById('zoom-in');
  const zoomOut = document.getElementById('zoom-out');
  const zoomReset = document.getElementById('zoom-reset');

  const projectSelect = document.getElementById('project-select');
  const newProjectBtn = document.getElementById('new-project-btn');
  const projectTitle = document.getElementById('project-title');

  const PROJECTS_KEY = 'moodboard:projects';
  const LAST_PROJECT_KEY = 'moodboard:lastProject';
  const DEFAULT_PROJECT = 'Docu Spearfishing';

  function safeGet(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, val); }catch(e){}
  }

  function getProjects(){
    try{
      const raw = safeGet(PROJECTS_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if(!list.includes(DEFAULT_PROJECT)) list.unshift(DEFAULT_PROJECT);
      return list;
    }catch(e){ return [DEFAULT_PROJECT]; }
  }
  function saveProjectsList(list){
    safeSet(PROJECTS_KEY, JSON.stringify(list));
  }
  function dataKey(project){ return 'moodboard:data:' + project; }

  let currentProject = safeGet(LAST_PROJECT_KEY) || DEFAULT_PROJECT;
  const cols = 5;
  const cellW = 340, cellH = 300;

  function refreshProjectSelect(){
    const list = getProjects();
    projectSelect.innerHTML = '';
    list.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      if(p === currentProject) opt.selected = true;
      projectSelect.appendChild(opt);
    });
  }

  function serializeBoard(){
    const cards = [];
    board.querySelectorAll('.card').forEach(card => {
      const rotMatch = /rotate\(([-0-9.]+)deg\)/.exec(card.style.transform || '');
      const rot = rotMatch ? rotMatch[1] : '0';
      if(card.classList.contains('text-card')){
        const txt = card.querySelector('.txt');
        cards.push({
          type: 'text',
          text: txt ? txt.innerText : '',
          x: parseFloat(card.style.left), y: parseFloat(card.style.top), rot
        });
      } else {
        const img = card.querySelector('img');
        const tag = card.querySelector('.tag');
        cards.push({
          type: 'image',
          src: img ? img.src : '',
          width: img ? parseFloat(img.style.width) : 220,
          label: tag ? tag.textContent : '',
          x: parseFloat(card.style.left), y: parseFloat(card.style.top), rot
        });
      }
    });
    return cards;
  }

  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      safeSet(dataKey(currentProject), JSON.stringify(serializeBoard()));
    }, 400);
  }

  function clearBoard(){
    board.querySelectorAll('.card').forEach(c => c.remove());
    cardCount = 0;
    updateCount();
  }

  function loadProject(project, useSeedIfEmpty){
    currentProject = project;
    safeSet(LAST_PROJECT_KEY, project);
    projectTitle.textContent = project;
    clearBoard();
    const raw = safeGet(dataKey(project));
    if(raw){
      try{
        const cards = JSON.parse(raw);
        cards.forEach(c => {
          if(c.type === 'text'){
            const card = addTextCard(c.x, c.y, true);
            const txt = card.querySelector('.txt');
            txt.innerText = c.text || '';
            card.style.transform = `rotate(${c.rot}deg)`;
          } else {
            const card = addCard(c.src, c.x, c.y, c.label || '', true);
            const img = card.querySelector('img');
            img.style.width = (c.width || 220) + 'px';
            card.style.transform = `rotate(${c.rot}deg)`;
          }
        });
      }catch(e){}
    } else if(useSeedIfEmpty){
      seedImages.forEach((src, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = 120 + col * cellW + randBetween(-30, 30);
        const y = 100 + row * cellH + randBetween(-30, 30);
        addCard(src, x, y, '', true);
      });
      scheduleSave();
    }
  }

  let scale = 0.72;
  let panX = -420, panY = -120;
  let cardCount = 0;

  function applyTransform(){
    board.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function updateCount(){
    countEl.textContent = cardCount + (cardCount > 1 ? ' images' : ' image');
  }

  function randBetween(a, b){ return a + Math.random() * (b - a); }

  function addTextCard(x, y, skipSave){
    const card = document.createElement('div');
    card.className = 'card text-card';
    const rot = randBetween(-2.5, 2.5).toFixed(2);
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.style.transform = `rotate(${rot}deg)`;
    card.style.zIndex = 10 + cardCount;

    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.contentEditable = 'true';
    txt.addEventListener('pointerdown', (e) => e.stopPropagation());
    card.appendChild(txt);

    const remove = document.createElement('div');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.addEventListener('pointerdown', (e) => e.stopPropagation());
    remove.addEventListener('click', (e) => {
      e.stopPropagation();
      card.remove();
      cardCount--;
      updateCount();
      scheduleSave();
    });
    card.appendChild(remove);

    board.appendChild(card);
    cardCount++;
    updateCount();
    makeDraggable(card);
    if(!skipSave){ txt.focus(); scheduleSave(); }
    txt.addEventListener('input', scheduleSave);
    txt.addEventListener('blur', scheduleSave);
    return card;
  }

  function addCard(src, x, y, label, skipSave){
    const card = document.createElement('div');
    card.className = 'card';
    const rot = randBetween(-6, 6).toFixed(2);
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    card.style.transform = `rotate(${rot}deg)`;
    card.style.zIndex = 10 + cardCount;

    const img = document.createElement('img');
    img.src = src;
    const startWidth = 220;
    img.style.width = startWidth + 'px';
    card.appendChild(img);

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = label || '';
    card.appendChild(tag);

    const remove = document.createElement('div');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.addEventListener('pointerdown', (e) => e.stopPropagation());
    remove.addEventListener('click', (e) => {
      e.stopPropagation();
      card.remove();
      cardCount--;
      updateCount();
      scheduleSave();
    });
    card.appendChild(remove);

    const resize = document.createElement('div');
    resize.className = 'resize';
    resize.addEventListener('pointerdown', (e) => e.stopPropagation());
    card.appendChild(resize);
    makeResizable(resize, img);

    board.appendChild(card);
    cardCount++;
    updateCount();
    makeDraggable(card);
    if(!skipSave) scheduleSave();
    return card;
  }

  function makeResizable(handle, img){
    let sx=0, startW=0, resizing=false;
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      resizing = true;
      handle.setPointerCapture(e.pointerId);
      sx = e.clientX;
      startW = img.getBoundingClientRect().width / scale;
    });
    handle.addEventListener('pointermove', (e) => {
      if(!resizing) return;
      const dx = (e.clientX - sx) / scale;
      const newW = Math.min(900, Math.max(90, startW + dx));
      img.style.width = newW + 'px';
    });
    function stop(){ if(resizing){ resizing = false; scheduleSave(); } }
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  }

  function makeDraggable(card){
    let sx=0, sy=0, ox=0, oy=0, dragging=false;
    card.addEventListener('pointerdown', (e) => {
      dragging = true;
      card.classList.add('dragging');
      card.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(card.style.left); oy = parseFloat(card.style.top);
      card.style.zIndex = 999;
    });
    card.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const dx = (e.clientX - sx) / scale;
      const dy = (e.clientY - sy) / scale;
      card.style.left = (ox + dx) + 'px';
      card.style.top = (oy + dy) + 'px';
    });
    function stop(e){
      if(!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      scheduleSave();
    }
    card.addEventListener('pointerup', stop);
    card.addEventListener('pointercancel', stop);
  }

  // pan the viewport when dragging empty space
  let panning = false, psx=0, psy=0, ppx=0, ppy=0;
  viewport.addEventListener('pointerdown', (e) => {
    if(e.target !== viewport && e.target !== board) return;
    panning = true;
    viewport.classList.add('panning');
    psx = e.clientX; psy = e.clientY;
    ppx = panX; ppy = panY;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if(!panning) return;
    panX = ppx + (e.clientX - psx);
    panY = ppy + (e.clientY - psy);
    applyTransform();
  });
  function stopPan(){ panning = false; viewport.classList.remove('panning'); }
  viewport.addEventListener('pointerup', stopPan);
  viewport.addEventListener('pointercancel', stopPan);

  // zoom
  function setScale(newScale, cx, cy){
    newScale = Math.min(1.6, Math.max(0.25, newScale));
    scale = newScale;
    applyTransform();
  }
  zoomIn.addEventListener('click', () => setScale(scale + 0.12));
  zoomOut.addEventListener('click', () => setScale(scale - 0.12));
  zoomReset.addEventListener('click', () => { scale = 0.72; panX = -420; panY = -120; applyTransform(); });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0012;
    setScale(scale + delta);
  }, { passive: false });

  // file handling
  function handleFiles(files, dropX, dropY){
    const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
    arr.forEach((file, i) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const bx = (dropX !== undefined ? dropX : randBetween(200, 2600));
        const by = (dropY !== undefined ? dropY : randBetween(150, 1600));
        addCard(e.target.result, bx + i*24, by + i*24, file.name.replace(/\.[^/.]+$/, ''));
      };
      reader.readAsDataURL(file);
    });
  }

  addBtn.addEventListener('click', () => fileInput.click());
  addTextBtn.addEventListener('click', () => {
    const rect = viewport.getBoundingClientRect();
    const cx = (rect.width/2 - panX) / scale - 80;
    const cy = (rect.height/2 - panY) / scale - 30;
    addTextCard(cx + randBetween(-40,40), cy + randBetween(-40,40));
  });
  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = '';
  });

  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropzone.classList.add('active');
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', (e) => {
    dragCounter--;
    if(dragCounter <= 0){ dropzone.classList.remove('active'); dragCounter = 0; }
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropzone.classList.remove('active');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      const rect = viewport.getBoundingClientRect();
      const bx = (e.clientX - rect.left - panX) / scale;
      const by = (e.clientY - rect.top - panY) / scale;
      handleFiles(e.dataTransfer.files, bx, by);
    }
  });

  // project switcher handlers
  refreshProjectSelect();
  projectSelect.addEventListener('change', () => {
    loadProject(projectSelect.value, false);
  });
  newProjectBtn.addEventListener('click', () => {
    const name = prompt('Nom du nouveau projet :');
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    const list = getProjects();
    if(!list.includes(trimmed)){
      list.push(trimmed);
      saveProjectsList(list);
    }
    refreshProjectSelect();
    projectSelect.value = trimmed;
    loadProject(trimmed, false);
  });

  // initial load
  loadProject(currentProject, currentProject === DEFAULT_PROJECT);

  applyTransform();
})();
</script>
